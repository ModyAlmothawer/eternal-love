name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 3 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Found ZIP: $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract project
        shell: bash
        run: |
          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | head -100

      - name: Find Android project
        shell: bash
        run: |
          PROJECT=$(find extracted -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -printf '%h\n' | head -n 1)

          if [ -z "$PROJECT" ]; then
            PROJECT=$(find extracted -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) \
              -printf '%h\n' | head -n 1)
          fi

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android project not found."
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          PROJECT=$(realpath "$PROJECT")

          echo "Android project: $PROJECT"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Create Debug Keystore if missing
        shell: bash
        working-directory: ${{ env.PROJECT }}
        run: |
          if [ ! -f "debug.keystore" ]; then
            echo "debug.keystore not found, generating a new one..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build APK
        shell: bash
        working-directory: ${{ env.PROJECT }}
        run: |
          echo "Building project from:"
          pwd

          echo "Gradle version:"
          gradle --version

          echo "Project files:"
          ls -la

          gradle assembleDebug --stacktrace --no-daemon

      - name: Find APK
        shell: bash
        run: |
          APK=$(find "$PROJECT" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            find "$PROJECT" -type f | grep -E '\.(apk|aab)$' || true
            exit 1
          fi

          echo "APK found: $APK"
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: eternal-love-apk
          path: ${{ env.APK }}
          if-no-files-found: error
        with:
          name: eternal-love-apk
          path: ${{ env.APK }}
          if-no-files-found: error
