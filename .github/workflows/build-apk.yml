name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Repository files"
          echo "======================================"

          find . -maxdepth 2 -type f -print | sort

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi

          echo "Found ZIP:"
          echo "$ZIP_FILE"

          rm -rf extracted-project
          mkdir -p extracted-project

          unzip -q "$ZIP_FILE" -d extracted-project

          echo "======================================"
          echo "ZIP extracted successfully"
          echo "======================================"

          find extracted-project -maxdepth 4 -type f -print | sort

      - name: Locate Gradle project
        shell: bash
        run: |
          set -e

          PROJECT_DIR=""

          SETTINGS_FILE=$(find extracted-project \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: No Gradle settings file found inside ZIP."
            echo "Expected settings.gradle or settings.gradle.kts"
            exit 1
          fi

          echo "======================================"
          echo "Gradle project found:"
          echo "$PROJECT_DIR"
          echo "======================================"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          ls -la "$PROJECT_DIR"

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Checking Android project..."

          if [ ! -d "app" ]; then
            echo "ERROR: app directory not found."
            exit 1
          fi

          if [ -f "settings.gradle.kts" ]; then
            echo "Found settings.gradle.kts"
          elif [ -f "settings.gradle" ]; then
            echo "Found settings.gradle"
          else
            echo "ERROR: Gradle settings file not found."
            exit 1
          fi

          if [ -f "build.gradle.kts" ]; then
            echo "Found build.gradle.kts"
          elif [ -f "build.gradle" ]; then
            echo "Found build.gradle"
          else
            echo "WARNING: Root build.gradle file not found."
          fi

          if [ -f "app/google-services.json" ]; then
            echo "Found app/google-services.json"
          else
            echo "WARNING: app/google-services.json not found."
          fi

          echo "Android project verification completed."

      - name: Prepare Gradle
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            echo "Gradle wrapper found."
            chmod +x ./gradlew
          else
            echo "Gradle wrapper not found."
            echo "Using GitHub runner Gradle installation."
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "======================================"
          echo "BUILDING APK"
          echo "======================================"

          if [ -f "./gradlew" ]; then
            ./gradlew clean :app:assembleDebug --stacktrace
          else
            gradle clean :app:assembleDebug --stacktrace
          fi

      - name: Find generated APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "Searching for generated APK"
          echo "======================================"

          find "$PROJECT_DIR/app/build/outputs" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$PROJECT_DIR/app/build/outputs" \
            -type f \
            -name "app-debug.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: app-debug.apk was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Lyubov-debug-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
