name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 3 -type f -name "*.zip" | head -1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Found ZIP: $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Extract project
        shell: bash
        run: |
          rm -rf extracted
          mkdir extracted

          unzip -q "$ZIP" -d extracted

          echo "Project files:"
          find extracted -maxdepth 3 -type f | head -150

      - name: Find Android project
        shell: bash
        run: |
          PROJECT=$(find extracted -type f -name "settings.gradle*" -print -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found."
            exit 1
          fi

          PROJECT=$(dirname "$PROJECT")

          echo "Android project found:"
          echo "$PROJECT"

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Show project structure
        shell: bash
        run: |
          echo "PROJECT:"
          echo "$PROJECT"

          echo ""
          echo "Gradle files:"
          find "$PROJECT" -maxdepth 3 \
            \( -name "build.gradle" \
            -o -name "build.gradle.kts" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "gradle.properties" \) \
            -print

      - name: Fix Gradle wrapper version if present
        shell: bash
        run: |
          WRAPPER="$PROJECT/gradle/wrapper/gradle-wrapper.properties"

          if [ -f "$WRAPPER" ]; then
            echo "Found Gradle wrapper."

            sed -i \
              's#gradle-[0-9][0-9.]*-bin.zip#gradle-9.3.1-bin.zip#g' \
              "$WRAPPER"

            cat "$WRAPPER"
          else
            echo "No Gradle wrapper found."
            echo "Using installed Gradle 9.3.1."
          fi

      - name: Build APK
        shell: bash
        working-directory: ${{ env.PROJECT }}
        run: |
          echo "Gradle version:"
          gradle --version

          echo ""
          echo "Starting APK build..."

          gradle assembleDebug \
            --stacktrace \
            --no-daemon \
            --console=plain

      - name: Find APK
        shell: bash
        run: |
          echo "Searching for APK..."

          APK=$(find "$PROJECT" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            echo ""
            echo "APK files found:"
            find "$PROJECT" -type f -name "*.apk" -print || true
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          cp "$APK" "$GITHUB_WORKSPACE/ETERNAL-LOVE.apk"

      - name: Verify APK
        shell: bash
        run: |
          if [ ! -f "ETERNAL-LOVE.apk" ]; then
            echo "ERROR: ETERNAL-LOVE.apk not found."
            exit 1
          fi

          echo "APK successfully created."
          ls -lh ETERNAL-LOVE.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ETERNAL-LOVE-APK
          path: ETERNAL-LOVE.apk
          if-no-files-found: error
          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | head -100

      - name: Find Android project
        shell: bash
        run: |
          PROJECT=$(find extracted -type f -name "settings.gradle*" -print -quit | xargs -r dirname)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android project not found."
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fix Gradle version
        shell: bash
        run: |
          WRAPPER="$PROJECT/gradle/wrapper/gradle-wrapper.properties"

          if [ ! -f "$WRAPPER" ]; then
            echo "ERROR: gradle-wrapper.properties not found."
            exit 1
          fi

          echo "Before:"
          cat "$WRAPPER"

          sed -i 's#gradle-[0-9][0-9.]*-bin.zip#gradle-9.3.1-bin.zip#g' "$WRAPPER"

          echo "After:"
          cat "$WRAPPER"

      - name: Build APK
        shell: bash
        working-directory: ${{ env.PROJECT }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Find APK
        shell: bash
        run: |
          APK=$(find "$PROJECT" -type f -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found: $APK"
          cp "$APK" ./ETERNAL-LOVE.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ETERNAL-LOVE-APK
          path: ETERNAL-LOVE.apk
          if-no-files-found: error
