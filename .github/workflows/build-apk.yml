name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        id: zip
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 3 -type f -name "*.zip" | head -1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "Found: $ZIP"

      - name: Extract project
        shell: bash
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q "$ZIP" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | head -100

      - name: Find Android project
        shell: bash
        run: |
          PROJECT=$(find extracted -type f -name "settings.gradle*" -print -quit | xargs -r dirname)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: Android project not found."
            exit 1
          fi

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Fix Gradle version
        shell: bash
        run: |
          WRAPPER="$PROJECT/gradle/wrapper/gradle-wrapper.properties"

          if [ ! -f "$WRAPPER" ]; then
            echo "ERROR: gradle-wrapper.properties not found."
            exit 1
          fi

          echo "Before:"
          cat "$WRAPPER"

          sed -i 's#gradle-[0-9][0-9.]*-bin.zip#gradle-9.3.1-bin.zip#g' "$WRAPPER"

          echo "After:"
          cat "$WRAPPER"

      - name: Build APK
        shell: bash
        working-directory: ${{ env.PROJECT }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Find APK
        shell: bash
        run: |
          APK=$(find "$PROJECT" -type f -name "*.apk" | head -1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found: $APK"
          cp "$APK" ./ETERNAL-LOVE.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ETERNAL-LOVE-APK
          path: ETERNAL-LOVE.apk
          if-no-files-found: error
